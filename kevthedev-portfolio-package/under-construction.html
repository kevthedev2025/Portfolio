<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction | Kevin Browne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101D26;
  --panel: #162832;
  --text: #F4F7F8;
  --muted: #9EACB3;
  --accent: #FF6B57;
  --line: rgba(255,255,255,0.1);
  --sans: 'DM Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px;
  background:
    radial-gradient(circle at 76% 18%, rgba(255,107,87,0.16), transparent 28%),
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

main {
  width: min(720px, 100%);
  padding: clamp(34px, 7vw, 64px);
  background: var(--panel);
  border: 1px solid var(--line);
}

.eyebrow {
  margin-bottom: 22px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

h1 {
  margin-bottom: 22px;
  font-size: clamp(42px, 8vw, 76px);
  line-height: 0.95;
  letter-spacing: -0.04em;
}

p {
  max-width: 560px;
  color: var(--muted);
  font-size: clamp(18px, 2.6vw, 22px);
  line-height: 1.65;
}

a {
  min-height: 56px;
  margin-top: 36px;
  padding: 0 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--accent);
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  text-decoration: none;
}

a:hover { background: #E95643; border-color: #E95643; }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">Coming soon</div>
    <h1>Page under construction.</h1>
    <p>This part of the portfolio is still being built. The finished project page will be linked here once it is ready.</p>
    <a href="index.html">Back to portfolio</a>
  </main>
</body>
</html>
